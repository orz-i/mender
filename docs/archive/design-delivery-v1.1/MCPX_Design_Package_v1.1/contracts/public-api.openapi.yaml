openapi: 3.1.0
info:
  title: MCPX Public Consumption API — Design Subset
  version: 0.1.0-design
  description: Design contract only. Not a deployed API, not a full Console/Admin contract, and not
    MCP wire JSON-RPC. All IDs and domains are illustrative.
servers:
- url: https://api.example.test/api/v1
  description: Non-production example domain
security:
- BearerCredential: []
paths:
  /catalog/tools:
    get:
      operationId: searchTools
      summary: Search only visible tools
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - &id010
        name: cursor
        in: query
        schema:
          type: string
      - &id011
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Visible results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListEnvelope'
        '400': &id002
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': &id003
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403': &id004
          description: Permission or budget denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404': &id005
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409': &id006
          description: Idempotency or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429': &id007
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': &id008
          description: Temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /catalog/tools/{tool_id}/versions/{version}:
    get:
      operationId: inspectTool
      parameters:
      - name: tool_id
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
      - name: version
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Exact immutable contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/quotes:
    parameters:
    - &id009
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      operationId: quoteRun
      summary: Estimate; does not execute or reserve funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Quote with cap evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs:
    parameters:
    - *id009
    post:
      operationId: startRun
      summary: Durably accept a run; all execution occurs in workers
      parameters:
      - &id013
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
        description: Stable key per logical operation. Same key with a different canonical request
          returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Durably accepted or still active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '200':
          description: Completed within the optional wait or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
    get:
      operationId: listRuns
      parameters: &id014
      - *id010
      - *id011
      responses:
        '200':
          description: Visible runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs/{run_id}:
    parameters:
    - *id009
    - &id012
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      operationId: getRun
      responses:
        '200':
          description: Current run and settlement state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs/{run_id}/cancel:
    parameters:
    - *id009
    - *id012
    post:
      operationId: cancelRun
      summary: Request cancellation; does not guarantee the external task has stopped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '200':
          description: Already terminal or cancellation already known
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs/{run_id}/resume:
    parameters:
    - *id009
    - *id012
    post:
      operationId: resumeRun
      summary: Answer an existing input request with current authorization
      parameters:
      - *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
      responses:
        '202':
          description: Resume durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs/{run_id}/events:
    parameters:
    - *id009
    - *id012
    get:
      operationId: listRunEvents
      description: This design subset specifies cursor-based JSON events. A future application SSE
        representation is not MCP transport resumability.
      parameters: *id014
      responses:
        '200':
          description: Committed events in stable sequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/runs/{run_id}/artifacts:
    parameters:
    - *id009
    - *id012
    get:
      operationId: listArtifacts
      responses:
        '200':
          description: Metadata only; no implicit public access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
  /workspaces/{workspace_id}/artifacts/{artifact_id}/download:
    parameters:
    - *id009
    - name: artifact_id
      in: path
      required: true
      schema: *id001
    post:
      operationId: authorizeArtifactDownload
      responses:
        '200':
          description: Short-lived URL after object-level authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadEnvelope'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '429': *id007
        '503': *id008
components:
  securitySchemes:
    BearerCredential:
      type: http
      scheme: bearer
      description: Scoped platform access token or opaque API key; never forward unchanged to suppliers.
  schemas:
    Money:
      type: object
      additionalProperties: false
      required:
      - currency
      - amount_micro
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount_micro:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: Non-negative integer in 10^-6 currency units. Parse and range-check server-side;
            never float.
    ToolRef:
      type: object
      additionalProperties: false
      required:
      - tool_id
      - version
      properties:
        tool_id: *id001
        version: *id001
    Meta:
      type: object
      required:
      - request_id
      - trace_id
      properties:
        request_id: *id001
        trace_id: *id001
        next_cursor:
          type:
          - string
          - 'null'
    Run:
      type: object
      required:
      - run_id
      - execution_state
      - billing_state
      properties:
        run_id: *id001
        execution_state:
          enum:
          - queued
          - running
          - waiting_input
          - cancel_requested
          - reconciling
          - succeeded
          - failed
          - canceled
          - timed_out
        external_outcome:
          enum:
          - unknown
          - pending
          - succeeded
          - failed
          - canceled
        billing_state:
          enum:
          - not_billable
          - reserved
          - pending_reconcile
          - settled
          - released
          - partially_refunded
          - refunded
        status_url:
          type: string
        charged:
          $ref: '#/components/schemas/Money'
        result: {}
        error_code:
          type:
          - string
          - 'null'
    StartRunRequest:
      type: object
      additionalProperties: false
      required:
      - tool_ref
      - toolset_id
      - connection_id
      - arguments
      - max_charge
      properties:
        tool_ref:
          $ref: '#/components/schemas/ToolRef'
        toolset_id: *id001
        connection_id: *id001
        arguments:
          type: object
        max_charge:
          $ref: '#/components/schemas/Money'
        wait_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - tool_ref
      - toolset_id
      - connection_id
      - arguments
      properties:
        tool_ref:
          $ref: '#/components/schemas/ToolRef'
        toolset_id: *id001
        connection_id: *id001
        arguments:
          type: object
    ToolSummary:
      type: object
      required:
      - tool_id
      - version
      - display_name
      properties:
        tool_id: *id001
        version: *id001
        display_name: *id001
        risk:
          type: string
        availability:
          type: string
    ToolDetail:
      allOf:
      - $ref: '#/components/schemas/ToolSummary'
      - type: object
        properties:
          input_schema:
            type: object
          output_schema:
            type: object
          price_version_id: *id001
          execution_mode:
            enum:
            - sync_short
            - async_task
          limitations:
            type: array
            items:
              type: string
    RunEvent:
      type: object
      required:
      - sequence
      - event_type
      - occurred_at
      properties:
        sequence:
          type: integer
          minimum: 1
        event_type: *id001
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
    Artifact:
      type: object
      required:
      - artifact_id
      - mime_type
      - size_bytes
      properties:
        artifact_id: *id001
        mime_type: *id001
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    RunEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Run'
        meta:
          $ref: '#/components/schemas/Meta'
    RunListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        meta:
          $ref: '#/components/schemas/Meta'
    ToolListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ToolSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    ToolEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ToolDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    EventListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        meta:
          $ref: '#/components/schemas/Meta'
    ArtifactListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        meta:
          $ref: '#/components/schemas/Meta'
    QuoteEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - quote_id
          - price_version_id
          - estimated
          - hard_cap_supported
          - expires_at
          properties:
            quote_id: *id001
            price_version_id: *id001
            estimated:
              $ref: '#/components/schemas/Money'
            upper_bound:
              $ref: '#/components/schemas/Money'
            hard_cap_supported:
              type: boolean
            expires_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'
    DownloadEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - url
          - expires_at
          properties:
            url:
              type: string
              format: uri
            expires_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'
    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    ResumeRequest:
      type: object
      additionalProperties: false
      required:
      - input_request_id
      - response
      - run_version
      properties:
        input_request_id: *id001
        response: {}
        run_version:
          type: integer
          minimum: 1
    ErrorEnvelope:
      type: object
      required:
      - error
      - meta
      properties:
        error:
          type: object
          required:
          - code
          - message
          - retryable
          properties:
            code: *id001
            message: *id001
            retryable:
              type: boolean
            field_errors:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/Meta'
