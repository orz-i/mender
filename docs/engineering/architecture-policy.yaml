version: '1.1'
status: design_policy_not_connected_to_ci
approved_directions:
- pnpm
- DDD
- Clean Architecture
- Dependency Inversion
toolchain:
  package_manager: pnpm
  pnpm_exact_version: null
  node_exact_version: null
  go_exact_version: null
  resolve_at_gate: G0
  workspace_root: .
  workspace_patterns:
  - frontend/apps/*
  - frontend/packages/*
  lockfile: pnpm-lock.yaml
  go_module_root: backend
  forbidden_lockfiles:
  - package-lock.json
  - npm-shrinkwrap.json
  - yarn.lock
  - bun.lock
  - bun.lockb
  ci_install:
  - pnpm
  - install
  - --frozen-lockfile
backend:
  organization: context_first_then_layers
  context_root: backend/internal/contexts
  contexts:
  - identity
  - catalog
  - connections
  - distribution
  - execution
  - commerce
  - supply
  - governance
  composition_roots:
  - backend/internal/bootstrap
  pure_domain_requires_no_frameworks: true
  application_ports_owned_by_consumer: true
  cross_context_imports: outbound ACL -> target public only; bootstrap explicitly
    composes
  public_contracts_must_not_import_internal_models: true
  data_ownership_enforcement:
  - migration ownership
  - repository contract tests
  - database roles/negative tests
  - review
  atomic_admission_exception:
    adr: ADR-020
    status: requires_G0_review
    contexts:
    - execution
    - commerce
    application_may_see_sql_tx: false
    network_io_inside_transaction: false
frontend:
  composition_root: apps/*/src/app
  module_layers:
  - domain
  - application
  - infrastructure
  - presentation
  pure_layers:
  - domain
  - application
  pure_layers_forbidden:
  - React
  - Router
  - TanStack Query
  - fetch
  - localStorage
  - api-client DTO
  workspace_dependency_protocol: 'workspace:'
  forbid_cross_app_private_imports: true
  required_checks:
  - resolved import graph
  - relative/alias imports
  - re-exports
  - type-only imports
  - dynamic import policy
  - package exports
  - dependency cycles
rules:
- id: GVR-01
  topic: pnpm 唯一性
  constraint: 前端所有安装和脚本使用 pnpm；仅一份锁
  tasks:
  - S1-07
  - S1-13
  tests:
  - T41
  owner_role: FE
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-02
  topic: 工具链固定
  constraint: packageManager 精确版本、Node 版本与锁文件审查
  tasks:
  - S0-10
  - S1-13
  tests:
  - T41
  owner_role: FE／SRE
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-03
  topic: 统一语言
  constraint: 术语、反例、上下文负责人和领域事件有记录
  tasks:
  - S0-02
  tests:
  - T45
  owner_role: BE-A
  gate: G0
  acceptance_mode: 评审
  state: 待评审
- id: GVR-04
  topic: 单一数据所有者
  constraint: 聚合、表、迁移、事件 Schema 有唯一上下文
  tasks:
  - S0-02
  - S1-05
  tests:
  - T43
  owner_role: BE-A
  gate: G1
  acceptance_mode: 阻断＋评审
  state: 未实施
- id: GVR-05
  topic: 领域内向依赖
  constraint: domain 不依赖框架、SQL、SDK、环境和系统时钟调用
  tasks:
  - S1-01
  - S1-13
  tests:
  - T42
  - T45
  owner_role: BE-A
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-06
  topic: 用例端口
  constraint: application 不引用具体 adapter；接口按消费方需求定义
  tasks:
  - S1-01
  tests:
  - T42
  - T46
  owner_role: BE-A
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-07
  topic: 跨域公开合同
  constraint: 只有出站防腐层和装配根可引用他域 public；不得深导入
  tasks:
  - S1-01
  - S1-13
  tests:
  - T43
  owner_role: BE-B
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-08
  topic: 聚合行为
  constraint: 状态与不变量通过方法维护，禁止通用 SetStatus 或改余额
  tasks:
  - S2-02
  - S2-03
  tests:
  - T45
  owner_role: BE-A
  gate: G2
  acceptance_mode: 测试＋评审
  state: 未实施
- id: GVR-09
  topic: 原子受理例外
  constraint: 专用 UoW；逐写点回滚；SQL 类型不进入应用层
  tasks:
  - S0-05
  - S2-03
  - S2-14
  tests:
  - T47
  owner_role: BE-A
  gate: G2
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-10
  topic: 提交后集成事件
  constraint: 显式映射、Outbox、消费去重和版本兼容
  tasks:
  - S2-07
  - S2-14
  tests:
  - T48
  owner_role: BE-B
  gate: G2
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-11
  topic: 前端纯业务模型
  constraint: domain／application 不引用 UI、路由、Query 或生成客户端
  tasks:
  - S1-07
  - S1-12
  tests:
  - T44
  owner_role: FE
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-12
  topic: 前端模块边界
  constraint: 公开 exports；别名、相对路径、re-export 与 type-only 全检查
  tasks:
  - S1-07
  - S1-13
  tests:
  - T44
  owner_role: FE
  gate: G1
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-13
  topic: 显式装配
  constraint: bootstrap／app 是 Composition Root；禁止 service locator
  tasks:
  - S1-01
  - S1-07
  tests:
  - T46
  owner_role: BE-A／FE
  gate: G1
  acceptance_mode: 测试＋评审
  state: 未实施
- id: GVR-14
  topic: 插件防腐层
  constraint: 供应商／SDK 类型不越过端口；插件不拿领域内部包
  tasks:
  - S3-05
  - S3-07
  - S4-01
  tests:
  - T42
  - T43
  - T48
  owner_role: BE-B
  gate: G4
  acceptance_mode: 阻断
  state: 未实施
- id: GVR-15
  topic: 例外到期
  constraint: 例外含 ADR、负责人、范围、到期日与退出计划
  tasks:
  - S0-10
  - S5-10
  tests:
  - T43
  owner_role: BE-A／QA
  gate: G5
  acceptance_mode: 阻断＋评审
  state: 未实施
- id: GVR-16
  topic: 证据与负向样例
  constraint: 每条自动规则都包含应失败 fixture；未执行不得称通过
  tasks:
  - S1-11
  - S5-10
  tests:
  - T41
  - T42
  - T43
  - T44
  owner_role: QA
  gate: G5
  acceptance_mode: 阻断
  state: 未实施
